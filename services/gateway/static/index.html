<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prochains passages Fil Bleu</title>
  <meta name="theme-color" content="#0b5cab">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand"><span class="logo" aria-hidden="true">●</span> Fil Bleu <span class="muted">· prochains passages</span></div>
      <form class="search" id="search-form" autocomplete="off" role="search">
        <label class="sr-only" for="search">Rechercher un arrêt</label>
        <input id="search" type="search" placeholder="Rechercher un arrêt…" spellcheck="false">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </form>
    </div>
    <nav class="wrap tabs" role="tablist" aria-label="Mode">
      <button id="tab-bus" class="tab" type="button" role="tab" aria-controls="view-bus">Bus &amp; tram</button>
      <button id="tab-trains" class="tab" type="button" role="tab" aria-controls="view-trains">Trains · Gare de Tours</button>
    </nav>
  </header>

  <main class="wrap bus-layout" id="view-bus" role="tabpanel" aria-labelledby="tab-bus">
   <div class="bus-head">
    <nav id="favorites" class="favorites" aria-label="Favoris" hidden></nav>

    <section class="stop-head">
      <div class="title">
        <h1 id="stop-name">…</h1>
        <button id="fav-toggle" class="star" type="button" aria-pressed="false" title="Ajouter aux favoris">☆</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="rt-only">
        <span class="track" aria-hidden="true"></span>
        Temps réel uniquement
      </label>
    </section>

    <nav id="directions" class="directions" aria-label="Direction"></nav>
   </div>

   <aside class="map-panel" aria-label="Carte en direct">
    <div id="map" class="map"></div>
    <p class="map-legend"><span class="live">positions en direct</span> <span id="map-count" class="muted"></span></p>
   </aside>

   <div class="bus-list">
    <p id="notice" class="notice" hidden></p>
    <section id="alerts" class="alerts" aria-label="Perturbations"></section>
    <ol id="departures" class="departures" aria-live="polite"></ol>

    <footer class="status">
      <span id="updated"></span>
      <button id="refresh" type="button">Actualiser</button>
    </footer>
   </div>
  </main>

  <main class="wrap" id="view-trains" role="tabpanel" aria-labelledby="tab-trains" hidden>
    <section class="stop-head">
      <div class="title">
        <h1 id="station-name">Gare de Tours</h1>
        <span id="to-title" class="to-title" hidden></span>
        <button id="to-fav" class="star" type="button" aria-pressed="false" title="Ajouter la destination aux favoris" hidden>☆</button>
      </div>
      <span class="muted small">Départs TGV, Intercités et TER</span>
    </section>

    <form class="search dest-search" id="to-form" autocomplete="off" role="search">
      <label class="sr-only" for="to-input">Destination</label>
      <input id="to-input" type="search" placeholder="Destination : ville ou gare…" spellcheck="false">
      <ul id="to-suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>
    <nav id="to-chips" class="directions" aria-label="Destinations favorites"></nav>
    <p id="trains-notice" class="notice" hidden></p>
    <section id="trains-alerts" class="alerts" aria-label="Perturbations"></section>
    <ol id="trains" class="departures" aria-live="polite"></ol>
    <footer class="status">
      <span id="trains-updated"></span>
      <button id="trains-refresh" type="button">Actualiser</button>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
